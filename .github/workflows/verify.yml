name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce-experiment1:
    name: Reproduce Experiment 1 from frozen records
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install the only analysis dependency
        run: pip install "numpy<2"

      - name: Verify all three arms offline (no model calls)
        run: python3 reproduce/verify_experiment1.py
